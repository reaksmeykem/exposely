name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  macos-assets:
    runs-on: macos-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = switch ($env:EVENT_NAME) {
            "release" { $env:RELEASE_EVENT_TAG; break }
            "push" { $env:PUSH_REF_NAME; break }
            default { $env:DISPATCH_TAG; break }
          }

          if (-not $tag) {
            throw "Could not resolve release tag for event '$env:EVENT_NAME'."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wailsVersion = (go list -m -f "{{.Version}}" github.com/wailsapp/wails/v2).Trim()
          if (-not $wailsVersion) {
            throw "Failed to resolve the Wails version from go.mod."
          }

          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"

          $goBin = Join-Path ((go env GOPATH).Trim()) "bin"
          $env:Path = "$goBin$([System.IO.Path]::PathSeparator)$env:Path"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: wails version

      - name: Build macOS app
        shell: pwsh
        run: wails build -platform darwin/universal -clean

      - name: Package macOS app
        shell: pwsh
        run: |
          $appPath = "build/bin/Exposely.app"
          $zipPath = "build/bin/Exposely-macos-universal.zip"

          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "Missing macOS app bundle: $appPath"
          }

          ditto -c -k --sequesterRsrc --keepParent $appPath $zipPath

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Missing macOS zip asset: $zipPath"
          }

      - name: Build macOS CLI
        shell: pwsh
        run: go build -trimpath "-ldflags=-s -w" -o build/bin/exposely-cli-macos-universal ./cmd/exposely

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release edit $env:RELEASE_TAG --latest
          } else {
            gh release create $env:RELEASE_TAG --title "Exposely $env:RELEASE_TAG" --notes "Exposely $env:RELEASE_TAG" --latest
          }

      - name: Upload macOS release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG `
            "build/bin/Exposely-macos-universal.zip" `
            "build/bin/exposely-cli-macos-universal" `
            --clobber

  windows-assets:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = switch ($env:EVENT_NAME) {
            "release" { $env:RELEASE_EVENT_TAG; break }
            "push" { $env:PUSH_REF_NAME; break }
            default { $env:DISPATCH_TAG; break }
          }

          if (-not $tag) {
            throw "Could not resolve release tag for event '$env:EVENT_NAME'."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path -LiteralPath (Join-Path $nsisPath "makensis.exe"))) {
            $nsisPath = "${env:ProgramFiles}\NSIS"
          }

          if (-not (Test-Path -LiteralPath (Join-Path $nsisPath "makensis.exe"))) {
            throw "makensis.exe was not found after installing NSIS."
          }

          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wailsVersion = (go list -m -f "{{.Version}}" github.com/wailsapp/wails/v2).Trim()
          if (-not $wailsVersion) {
            throw "Failed to resolve the Wails version from go.mod."
          }

          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"

          $goBin = Join-Path ((go env GOPATH).Trim()) "bin"
          $env:Path = "$goBin;$env:Path"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          makensis /VERSION
          wails version

      - name: Build desktop app and NSIS installer
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -nsis

      - name: Build CLI
        shell: pwsh
        run: go build -trimpath "-ldflags=-s -w" -o build/bin/exposely-cli.exe ./cmd/exposely

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            "build/bin/Exposely.exe",
            "build/bin/Exposely-amd64-installer.exe",
            "build/bin/exposely-cli.exe"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release edit $env:RELEASE_TAG --latest
          } else {
            gh release create $env:RELEASE_TAG --title "Exposely $env:RELEASE_TAG" --notes "Exposely $env:RELEASE_TAG" --latest
          }

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG `
            "build/bin/Exposely.exe" `
            "build/bin/Exposely-amd64-installer.exe" `
            "build/bin/exposely-cli.exe" `
            --clobber
